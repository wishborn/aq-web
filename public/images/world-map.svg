    <line x1="0" y1="300" x2="1200" y2="300" opacity="0.15"/>
    <line x1="0" y1="450" x2="1200" y2="450" opacity="0.15"/>
    <line x1="300" y1="0" x2="300" y2="600" opacity="0.15"/>
